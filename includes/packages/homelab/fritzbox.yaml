fritzbox:
  template:
    - sensor:
        - name: "Fritz Box 6660 Cable Upload Throughput Mbs"
          default_entity_id: sensor.c_fritz_box_6660_cable_upload_throughput_mbs
          unit_of_measurement: "Mbit/s"
          device_class: data_rate
          state_class: measurement
          icon: mdi:upload
          state: >-
            {{ (states('sensor.fritz_box_6660_cable_upload_throughput') | float(0) / 125) | round(2) }}
          availability: >-
            {{ is_number(states('sensor.fritz_box_6660_cable_upload_throughput')) }}

        - name: "Fritz Box 6660 Cable Download Throughput Mbs"
          default_entity_id: sensor.c_fritz_box_6660_cable_download_throughput_mbs
          unit_of_measurement: "Mbit/s"
          device_class: data_rate
          state_class: measurement
          icon: mdi:download
          state: >-
            {{ (states('sensor.fritz_box_6660_cable_download_throughput') | float(0) / 125) | round(2) }}
          availability: >-
            {{ is_number(states('sensor.fritz_box_6660_cable_download_throughput')) }}

  automation:
    - alias: "[Fritzbox] Repower Router If Connection Lost"
      mode: single
      initial_state: true
      trigger:
        - platform: state
          entity_id: binary_sensor.fritzbox_6660
          to: "off"
          for: "00:05:00"
      action:
        - service: script.repower_fritzbox_router
          data:
            message: "🔄 Роутер в гостиной был перезагружен. Причина: пропала связь."

    - alias: "[Fritzbox] Repower Router If Public IP Is Incorrect"
      mode: single
      initial_state: true
      variables:
        expected_public_ipv4_prefix: !secret expected_public_ipv4_prefix
      trigger:
        - platform: state
          entity_id: sensor.public_ipv4
          for: "00:05:00"
      condition:
        - condition: template
          value_template: >-
            {% set expected_prefix = expected_public_ipv4_prefix | default('', true) %}
            {{ expected_prefix | length > 0 and
               not states('sensor.public_ipv4').startswith(expected_prefix) }}
      action:
        - service: script.repower_fritzbox_router
          data:
            message: >-
              🔄 Роутер в гостиной был перезагружен. Причина: текущий публичный IPv4
              {{ states('sensor.public_ipv4') }} не начинается с {{ expected_public_ipv4_prefix }}.

    - alias: "[Fritzbox] Nightly Restart"
      trigger:
        platform: time
        at: "04:00:00"
      condition:
        condition: time
        weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
      action:
        - service: button.press
          target:
            entity_id: button.fritz_box_6660_cable_reboot

    - alias: "[Fritzbox] Switch Wi-Fi if unavailable"
      trigger:
        - platform: state
          entity_id: binary_sensor.c_hass_wifi_connected
          to: "off"
          for: "00:00:05"
      action:
        - service: switch.turn_off
          target:
            entity_id: switch.fritz_box_6660_cable_wi_fi_aeki_5ghz
        - service: switch.turn_off
          target:
            entity_id: switch.fritz_box_6660_cable_wi_fi_aeki_g
        - service: switch.turn_on
          target:
            entity_id: switch.fritz_box_6660_cable_wi_fi_aeki_5ghz
        - service: switch.turn_on
          target:
            entity_id: switch.fritz_box_6660_cable_wi_fi_aeki_g

    - alias: "[Fritzbox] Daily router cleanup"
      mode: single
      initial_state: true
      trigger:
        - platform: time
          at: "05:00:00"
      action:
        - service: button.press
          target:
            entity_id: button.fritz_box_6660_cable_cleanup

  script:
    repower_fritzbox_router:
      alias: "[Fritzbox] Repower Router"
      mode: single
      fields:
        message:
          description: "Reason for the router repower"
          required: true
          selector:
            text:
      sequence:
        - delay:
            seconds: 30
        - service: switch.turn_off
          target:
            entity_id: switch.livingroom_router
        - delay:
            seconds: 5
        - service: switch.turn_on
          target:
            entity_id: switch.livingroom_router
        - service: script.send_sms_to_azat
          data:
            message: "{{ message }}"
