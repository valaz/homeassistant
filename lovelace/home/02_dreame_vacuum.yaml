title: Vacuum
subview: false
path: vacuum
type: sections
icon: mdi:robot-vacuum
cards: []
max_columns: 3
sections:
  - type: grid ### Vacuum ###
    cards:
      - type: heading
        icon: ""
        heading: Vacuum
        heading_style: title
        badges:
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_status
            color: amber
            tap_action:
              action: more-info
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_state
            color: blue
            icon: mdi:clock
            tap_action:
              action: more-info
      - type: custom:vacuum-card
        entity: vacuum.chimin
        show_name: false
        show_status: false

      - type: heading
        icon: mdi:broom
        heading: Main Brush
        heading_style: subtitle
        badges:
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_main_brush_left
            color: blue
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_main_brush_time_left
            color: blue
            icon: mdi:clock
          - type: entity
            show_state: true
            show_icon: true
            entity: button.chimin_reset_main_brush
            tap_action:
              action: toggle
            icon: mdi:restart
            color: green
            name: Reset
            state_content: name
      - type: heading
        icon: mdi:brush
        heading: Side Brush
        heading_style: subtitle
        badges:
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_side_brush_left
            color: blue
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_side_brush_time_left
            color: blue
            icon: mdi:clock
          - type: entity
            show_state: true
            show_icon: true
            entity: button.chimin_reset_side_brush
            tap_action:
              action: toggle
            icon: mdi:restart
            color: green
            name: Reset
            state_content: name
      - type: heading
        icon: mdi:air-filter
        heading: Filter
        heading_style: subtitle
        badges:
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_filter_left
            color: blue
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_filter_time_left
            color: blue
            icon: mdi:clock
          - type: entity
            show_state: true
            show_icon: true
            entity: button.chimin_reset_filter
            tap_action:
              action: toggle
            icon: mdi:restart
            color: green
            name: Reset
            state_content: name
      - type: heading
        icon: mdi:eye
        heading: Sensor
        heading_style: subtitle
        badges:
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_sensor_dirty_left
            color: blue
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_sensor_dirty_time_left
            icon: mdi:clock
            color: blue
          - type: entity
            show_state: true
            show_icon: true
            entity: button.chimin_reset_sensor
            tap_action:
              action: toggle
            icon: mdi:restart
            color: green
            name: Reset
            state_content: name
      - type: heading
        icon: mdi:tire
        heading: Wheel
        heading_style: subtitle
        badges:
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_wheel_dirty_left
            color: blue
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_wheel_dirty_time_left
            icon: mdi:clock
            color: blue
          - type: entity
            show_state: true
            show_icon: true
            entity: button.chimin_reset_wheel
            tap_action:
              action: toggle
            icon: mdi:restart
            color: green
            name: Reset
            state_content: name

  - type: grid ### Zone Clean ###
    cards:
      - type: heading
        icon: ""
        heading: Zone Clean
        heading_style: title

      - type: heading
        icon: ""
        heading: Zones
        heading_style: subtitle
      - type: tile
        entity: input_boolean.clean_bathroom
        color: green
        tap_action:
          action: toggle
      - type: tile
        entity: input_boolean.clean_bedroom
        color: green
        tap_action:
          action: toggle
      - type: tile
        entity: input_boolean.clean_kidsroom
        color: green
        tap_action:
          action: toggle
      - type: tile
        entity: input_boolean.clean_kitchen
        color: green
        tap_action:
          action: toggle
      - type: tile
        entity: input_boolean.clean_livingroom
        color: green
        tap_action:
          action: toggle

      - type: heading
        icon: ""
        heading: Control
        heading_style: subtitle
      - type: tile
        entity: input_number.zones_clean_repeats
        name: Repeats
        color: blue
        vertical: true
        features:
          - type: "numeric-input"
            style: "buttons"

      - type: tile
        entity: script.reset_zone_selection
        name: Reset
        color: green
        vertical: false
        tap_action:
          action: toggle
      - type: tile
        entity: script.chimin_start_room_cleaning
        name: Start
        color: green
        vertical: true
        tap_action:
          action: toggle

  - type: grid ### Map ###
    cards:
      - type: heading
        icon: ""
        heading: Map
        heading_style: title
        badges:
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_cleaned_area
            color: amber
            tap_action:
              action: more-info
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_cleaning_time
            icon: mdi:clock
            color: blue
            tap_action:
              action: more-info
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.chimin_cleaning_history
            icon: mdi:history
            color: green
            tap_action:
              action: more-info
      - type: picture-entity
        show_state: false
        show_name: false
        camera_view: live
        entity: camera.chimin_map
        camera_image: camera.chimin_map
        aspect_ratio: "135x130"
        layout_options:
          grid_columns: full

      - type: custom:xiaomi-vacuum-map-card
        entity: vacuum.chimin
        vendor: xiaomi
        map_source:
          camera: camera.chimin_map
        calibration_source:
          camera: true
        vacuum_platform: Tasshack/dreame-vacuum
        map_modes:
          - template: vacuum_clean_zone
          - template: vacuum_clean_point
          - template: vacuum_goto
          - template: vacuum_clean_segment
            predefined_selections:
              - id: 2
                outline:
                  - - -1550
                    - 1900
                  - - -1550
                    - 5350
                  - - 2550
                    - 5350
                  - - 2550
                    - 1900
                label:
                  text: Kitchen
                  x: 500
                  y: 3625
                  offset_y: 35
                icon:
                  name: "mdi:table-chair"
                  x: 500
                  y: 3625
              - id: 3
                outline:
                  - - 2200
                    - 1850
                  - - 2200
                    - 5850
                  - - 6100
                    - 5850
                  - - 6100
                    - 1850
                label:
                  text: Bedroom
                  x: 4150
                  y: 3850
                  offset_y: 35
                icon:
                  name: "mdi:bed-king-outline"
                  x: 4150
                  y: 3850
              - id: 4
                outline:
                  - - 3050
                    - -350
                  - - 3050
                    - 1400
                  - - 5400
                    - 1400
                  - - 5400
                    - -350
                label:
                  text: Bathroom
                  x: 4225
                  y: 525
                  offset_y: 35
                icon:
                  name: "mdi:shower-head"
                  x: 4225
                  y: 525
              - id: 5
                outline:
                  - - -3150
                    - -750
                  - - -3150
                    - 1900
                  - - 3050
                    - 1900
                  - - 3050
                    - -750
                label:
                  text: Livingroom
                  x: -50
                  y: 575
                  offset_y: 35
                icon:
                  name: "mdi:sofa-outline"
                  x: -50
                  y: 575
              - id: 6
                outline:
                  - - -2300
                    - -3400
                  - - -2300
                    - -750
                  - - 1250
                    - -750
                  - - 1250
                    - -3400
                label:
                  text: Kidsroom
                  x: -525
                  y: -2075
                  offset_y: 35
                icon:
                  name: "mdi:human-child"
                  x: -525
                  y: -2075
        tiles:
          - label: Status
            entity: sensor.chimin_status
          - label: Mode
            entity: select.chimin_cleaning_mode
          - label: Battery
            entity: sensor.chimin_battery_level
          - label: Max Power
            entity: switch.chimin_max_suction_power

    column_span: 1
