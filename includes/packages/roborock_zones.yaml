# https://community.home-assistant.io/t/howto-xiaomi-vacuum-zoned-cleaning/51293

roborock_zones:

  template:
    - sensor:
        - name: "Roborock Clean Zones"
          default_entity_id: sensor.c_roborock_clean_zones
          state: >
            {% set clean_data = namespace(zones=[], zone_names=[]) %}
            {% for entity in states.input_boolean %}
              {% if 'zone_coordinates' in entity.attributes and is_state(entity.entity_id, 'on') %}
                {% set clean_data.zones = clean_data.zones + [entity.attributes.zone_coordinates] %}
              {% endif %}
            {% endfor %}
            {{ clean_data.zones }}

        - name: "Roborock Clean Zones Names"
          default_entity_id: sensor.c_roborock_clean_zones_names
          state: >
            {% set clean_data = namespace(zones=[], zone_names=[]) %}
            {% for entity in states.input_boolean %}
              {% if 'zone_coordinates' in entity.attributes and is_state(entity.entity_id, 'on') %}
                {% set clean_data.zone_names = clean_data.zone_names + [entity.attributes.friendly_name | replace('Clean ', '')] %}
              {% endif %}
            {% endfor %}
            {{ clean_data.zone_names }}

  script:
    roborock_start_zone_cleaning:
      alias: "[Roborock] Start Zone Cleaning"
      icon: mdi:play-box-outline
      mode: restart
      sequence:
        - delay: "00:00:02"
        - variables:
            zones: "{{ states('sensor.c_roborock_clean_zones') }}"
            zone_names: "{{ states('sensor.c_roborock_clean_zones_names') }}"
        - condition: template
          value_template: "{{ zones | length > 0 }}"
        - action: notify.send_message
          target:
            entity_id: notify.tg_bot_valaz
          data:
            message: "🛑 Roborock will not start cleaning. Selected zones: {{ zone_names }}."


