title: Syncthing
path: syncthing
type: sections
icon: mdi:sync
cards: []
max_columns: 3
sections:
  - type: grid ###   Syncthing Overview    ###
    cards:
      - type: heading
        heading_style: title
        heading: Syncthing
        icon: mdi:sync
        badges:
          - type: entity
            entity: binary_sensor.syncthing_running
            color: green
            tap_action:
              action: more-info

      - type: tile
        entity: button.syncthing_scan_all_folders
        name: Scan All Folders
        icon: mdi:folder-sync
        color: blue
        vertical: false
        layout_options:
          grid_columns: full
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.syncthing_scan_all_folders

      - type: heading
        heading_style: title
        heading: Ultron
        icon: mdi:server
        badges:
          - type: entity
            entity: binary_sensor.syncthing_device_ultron_connected
            color: green
            tap_action:
              action: more-info

      - type: conditional
        conditions:
          - entity: binary_sensor.syncthing_device_ultron_paused
            state: "on"
        card:
          type: tile
          entity: binary_sensor.syncthing_device_ultron_paused
          name: Paused
          color: grey
          vertical: false
          tap_action:
            action: more-info

      - type: tile
        entity: button.syncthing_device_ultron_pause
        name: Pause
        # icon: mdi:folder-sync
        color: red
        vertical: false
        tap_action:
          action: more-info
      - type: tile
        entity: button.syncthing_device_ultron_resume
        name: Resume
        # icon: mdi:folder-sync
        color: green
        vertical: false
        tap_action:
          action: more-info

      - type: tile
        entity: sensor.syncthing_device_ultron_downloaded
        features_position: bottom
        vertical: false
        name: Downloaded
        icon: mdi:download
        color: green
        show_entity_picture: false
        features:
          - type: "trend-graph"
            hours_to_show: 24
            detail: true

      - type: tile
        entity: sensor.syncthing_device_ultron_uploaded
        features_position: bottom
        vertical: false
        name: Uploaded
        icon: mdi:upload
        color: blue
        show_entity_picture: false
        features:
          - type: "trend-graph"
            hours_to_show: 24
            detail: true

