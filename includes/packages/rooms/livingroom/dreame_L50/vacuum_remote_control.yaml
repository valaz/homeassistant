vacuum_remote_control:
  timer:
    vacuum_remote_zone_clean_delay:
      name: "Запущена зональная уборка"
      duration: "00:00:05"

  input_number:
    zones_clean_repeats:
      name: Zone Clean Repeats
      initial: 1
      min: 1
      max: 3
      step: 1

  input_boolean:
    clean_saloon:
      name: Saloon
    clean_bathroom:
      name: Bathroom
    clean_bedroom:
      name: Bedroom
    clean_kidsroom:
      name: Kidsroom
    clean_kitchen:
      name: Kitchen
    clean_kitchen_table:
      name: Kitchen Table
    clean_livingroom:
      name: Livingroom
    clean_livingroom_entrance:
      name: Livingroom Entrance

  script:
    reset_zone_selection:
      alias: "[Vacuum Remote] Reset Zone Selection"
      icon: mdi:delete-restore
      sequence:
        - service: input_boolean.turn_off
          data:
            entity_id: >
              {% set entities = states.input_boolean | selectattr('attributes.zone_coordinates', 'defined') | map(attribute='entity_id') | list %}
              {{ entities }}
        - service: input_number.set_value
          data:
            entity_id: input_number.zones_clean_repeats
            value: 1

    restart_zone_clean_delay_timer:
      alias: "[Vacuum Remote] Restart Zone Clean Delay Timer"
      icon: mdi:delete-restore
      sequence:
        - service: timer.cancel
          target:
            entity_id: timer.vacuum_remote_zone_clean_delay
        - service: timer.start
          target:
            entity_id: timer.vacuum_remote_zone_clean_delay

  automation:
    - alias: "[Vacuum Remote] Return To Base"
      mode: restart
      initial_state: true
      trigger:
        - platform: state
          entity_id: sensor.vacuum_remote_control_action
          to: "1_hold"
      action:
        - service: vacuum.return_to_base
          data: {}
          target:
            entity_id: vacuum.chimin # USE YOUR ROBOT ENTITY_ID HERE

    - alias: "[Vacuum Remote] Start Kitchen cleaning"
      mode: restart
      initial_state: true
      trigger:
        - platform: state
          entity_id: sensor.vacuum_remote_control_action
          to: "1_single"
      action:
        - service: input_boolean.turn_on
          target:
            entity_id:
              - input_boolean.clean_kitchen
        - service: script.turn_on
          entity_id:
            - script.restart_zone_clean_delay_timer

    - alias: "[Vacuum Remote] Start Livingroom cleaning"
      mode: restart
      initial_state: true
      trigger:
        - platform: state
          entity_id: sensor.vacuum_remote_control_action
          to: "2_single"
      action:
        - service: input_boolean.turn_on
          target:
            entity_id:
              - input_boolean.clean_livingroom
        - service: script.turn_on
          entity_id:
            - script.restart_zone_clean_delay_timer

    - alias: "[Vacuum Remote] Start Kidsroom cleaning"
      mode: restart
      initial_state: true
      trigger:
        - platform: state
          entity_id: sensor.vacuum_remote_control_action
          to: "3_single"
      action:
        - service: input_boolean.turn_on
          target:
            entity_id:
              - input_boolean.clean_kidsroom
        - service: script.turn_on
          entity_id:
            - script.restart_zone_clean_delay_timer

    - alias: "[Vacuum Remote] Start Bedroom cleaning"
      mode: restart
      initial_state: true
      trigger:
        - platform: state
          entity_id: sensor.vacuum_remote_control_action
          to: "4_single"
      action:
        - service: input_boolean.turn_on
          target:
            entity_id:
              - input_boolean.clean_bedroom
        - service: script.turn_on
          entity_id:
            - script.restart_zone_clean_delay_timer

    - alias: "[Vacuum Remote] Start Bathroom cleaning"
      mode: restart
      initial_state: true
      trigger:
        - platform: state
          entity_id: sensor.vacuum_remote_control_action
          to: "4_double"
      action:
        - service: input_boolean.turn_on
          target:
            entity_id:
              - input_boolean.clean_bathroom
        - service: script.turn_on
          entity_id:
            - script.restart_zone_clean_delay_timer

    - alias: "[Vacuum Remote] Start Zone Cleanup on Timer"
      mode: restart
      initial_state: true
      trigger:
        - platform: event
          event_type: timer.finished
          event_data:
            entity_id: timer.vacuum_remote_zone_clean_delay
      action:
        - service: script.turn_on
          entity_id:
            - script.chimin_start_room_cleaning # USE YOUR CLEANING SCRIPT HERE
