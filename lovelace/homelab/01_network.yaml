  - type: grid ###   Uptime    ###
    cards:
      - type: heading
        heading_style: title
        heading: Sevices
        icon: mdi:toolbox-outline

      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          show_header_toggle: false
        filter:
          include:
            - entity_id: "sensor.*_status"
              name: "*]*"
              sort:
                method: name
          exclude:
            - entity_id: "sensor.smarthome_*_status"
              sort:
                method: name

  - type: grid ###   Uptime    ###
    cards:
      - type: heading
        heading_style: title
        heading: Devices
        icon: mdi:devices

      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          show_header_toggle: false
        filter:
          include:
            - entity_id: "sensor.smarthome_*_status"
              name: "*]*"
              sort:
                method: name
          exclude:
            - entity_id: "sensor.uptimekuma_smarthome_*"
              sort:
                method: name
