title: Network
path: network
type: sections
icon: mdi:network
cards: []
max_columns: 3
sections:
  - type: grid ###   FFRITZ!Box    ###
    cards:
      - type: heading
        heading_style: title
        heading: FFRITZ!Box
        icon: mdi:router-wireless
        tap_action:
          action: url
          url_path: http://192.168.178.1
        badges:
          - type: entity
            entity: sensor.fritz_box_6660_cable_cpu_temperature
            color: orange
            tap_action:
              action: more-info

      - type: heading
        heading: Last Restart
        heading_style: subtitle
        icon: mdi:restart-alert
        badges:
          - type: entity
            entity: sensor.fritz_box_6660_cable_last_restart
            tap_action:
              action: more-info

      - type: tile
        entity: switch.fritz_box_6660_cable_wi_fi_aeki
        name: AEKI
        color: green
        vertical: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        layout_options:
          grid_columns: 1
          grid_rows: 2
      - type: tile
        entity: switch.fritz_box_6660_cable_wi_fi_aeki_2
        name: AEKI_2
        color: green
        vertical: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        layout_options:
          grid_columns: 1
          grid_rows: 2
      - type: tile
        entity: switch.fritz_box_6660_cable_wi_fi_aeki_g
        name: AEKI_G
        color: red
        vertical: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        layout_options:
          grid_columns: 1
          grid_rows: 2

      - type: tile
        entity: button.fritz_box_6660_cable_restart
        name: Restart
        vertical: false
        tap_action:
          action: toggle
      - type: tile
        entity: button.fritz_box_6660_cable_reconnect
        name: Reconnect
        vertical: false
        tap_action:
          action: toggle
      - type: tile
        entity: button.fritz_box_6660_cable_firmware_update
        name: Firmware Update
        vertical: false
        tap_action:
          action: toggle
      - type: tile
        entity: button.fritz_box_6660_cable_cleanup
        name: Cleanup
        vertical: false
        tap_action:
          action: toggle

      - type: custom:mini-graph-card
        name: "Download Speed"
        animate: true
        hour24: true
        color_thresholds:
          - value: 100
            color: "#539652"
          - value: 500
            color: "#f39c12"
          - value: 800
            color: "#c0392b"
        hours_to_show: 1
        points_per_hour: 60
        update_interval: 10
        entities:
          - entity: sensor.c_fritz_box_6660_cable_download_throughput_mbs
        layout_options:
          grid_columns: 2
          grid_rows: 3
      - type: custom:mini-graph-card
        name: "Upload Speed"
        animate: true
        hour24: true
        color_thresholds:
          - value: 100
            color: "#ffba08"
          - value: 500
            color: "#f48c06"
          - value: 800
            color: "#d00000"
        hours_to_show: 1
        points_per_hour: 60
        update_interval: 10
        entities:
          - entity: sensor.c_fritz_box_6660_cable_upload_throughput_mbs
        layout_options:
          grid_columns: 2
          grid_rows: 3

      - type: heading
        heading: Ping History
        heading_style: subtitle
        icon: mdi:table-tennis
        badges:
          - type: entity
            entity: binary_sensor.fritzbox_6660
            state_content: last_changed
            tap_action:
              action: more-info
      - type: "custom:logbook-card"
        entity: binary_sensor.fritzbox_6660
        title: ""
        # hidden_state:
        #   - "off"
        #   - "unknown"
        #   - "unavailable"
        #   - ""
        max_items: 4
        show:
          end_date: false
          start_date: true
        layout_options:
          grid_columns: 4
          grid_rows: 4

  - type: grid ###   Flint 2    ###
    cards:
      - type: heading
        heading_style: title
        heading: Flint 2
        icon: mdi:router-wireless
        tap_action:
          action: url
          url_path: http://10.60.10.1
        badges:
          - type: entity
            entity: sensor.gl_inet_mt6000_cpu_temperature
            color: orange
            tap_action:
              action: more-info

      - type: heading
        heading_style: subtitle
        heading: Hardware
        icon: mdi:cpu-64-bit
        badges:
          - type: entity
            show_icon: true
            color: blue
            entity: sensor.gl_inet_mt6000_memory_usage
            tap_action:
              action: more-info
          - type: entity
            show_icon: true
            color: green
            entity: sensor.gl_inet_mt6000_flash_usage
            tap_action:
              action: more-info

      - type: heading
        heading: Load 1m/5m/15m
        heading_style: subtitle
        icon: mdi:server-network
        badges:
          - type: entity
            entity: sensor.gl_inet_mt6000_load_avg_1m
            show_icon: false
            tap_action:
              action: more-info
          - type: entity
            entity: sensor.gl_inet_mt6000_load_avg_5m
            show_icon: false
            tap_action:
              action: more-info
          - type: entity
            entity: sensor.gl_inet_mt6000_load_avg_15m
            show_icon: false
            tap_action:
              action: more-info

      - type: heading
        heading: Uptime
        heading_style: subtitle
        icon: mdi:restart-alert
        badges:
          - type: entity
            entity: sensor.gl_inet_mt6000_uptime
            tap_action:
              action: more-info

      - type: tile
        entity: switch.gl_inet_mt6000_aeki
        name: AEKI
        color: green
        vertical: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        layout_options:
          grid_columns: 1
          grid_rows: 2
      - type: tile
        entity: switch.gl_inet_mt6000_aeki_y
        name: AEKI_Y
        color: orange
        vertical: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        layout_options:
          grid_columns: 1
          grid_rows: 2
      - type: tile
        entity: switch.gl_inet_mt6000_aeki_r
        name: AEKI_R
        color: red
        vertical: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        layout_options:
          grid_columns: 1
          grid_rows: 2
      - type: tile
        entity: switch.gl_inet_mt6000_aeki_g
        name: AEKI_G
        color: purple
        vertical: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        layout_options:
          grid_columns: 1
          grid_rows: 2

      - type: tile
        entity: switch.gl_inet_mt6000_aeki_2
        name: AEKI_2
        color: green
        vertical: false
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: tile
        entity: switch.gl_inet_mt6000_aeki_h
        name: AEKI_H
        color: blue
        vertical: false
        tap_action:
          action: toggle
        hold_action:
          action: more-info

      - type: tile
        entity: button.gl_inet_mt6000_reboot
        name: Reboot
        vertical: false
        tap_action:
          action: more-info
      - type: tile
        entity: switch.gl_inet_mt6000_tailscale
        name: Tailscale
        vertical: false
        tap_action:
          action: toggle

  - type: grid ###   SMS Gateway    ###
    cards:
      - type: heading
        heading_style: title
        heading: SMS Gateway
        icon: mdi:message-processing
        badges:
          - type: entity
            entity: sensor.operator
            color: blue
            tap_action:
              action: more-info

      - type: tile
        entity: button.gammu_gateway_reset_modem
        name: Reset
        color: red
        vertical: true
        tap_action:
          action: toggle

      - type: tile
        entity: sensor.signal_strength
        features_position: bottom
        vertical: false
        name: "Signal Strength"
        color: light-blue
        show_entity_picture: false
        features:
          - type: "trend-graph"
            hours_to_show: 24
            detail: true

      - type: tile
        entity: script.sms_emoji_test
        name: Emoji Test
        color: yellow
        vertical: false
        tap_action:
          action: script.sms_emoji_test

      - type: heading
        heading_style: title
        heading: Internet
        icon: mdi:earth
        badges:
          - type: entity
            entity: sensor.public_ipv4
            icon: mdi:ip
            color: blue
            tap_action:
              action: more-info

      - type: heading
        heading: Speedtest
        heading_style: subtitle
        icon: mdi:speedometer
        badges:
          - type: entity
            entity: sensor.speedtest_ping
            tap_action:
              action: more-info
          - type: entity
            entity: sensor.speedtest_download
            color: green
            tap_action:
              action: more-info
          - type: entity
            entity: sensor.speedtest_upload
            color: orange
            tap_action:
              action: more-info

